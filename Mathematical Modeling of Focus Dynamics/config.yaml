model_name: resnet18
optimizer: adamw
normalize: imagenet
augment: true

img_size: 224
batch_size: 16
epochs: 8
learning_rate: 0.0001
seed: 99

classes:
  - focused_reading   # user is focused while reading (book, screen...)
  - focused_writing   # user is focused while writing (handwriting)
  - not_activity      # no relevant activity detected (off-task)
  - not_phone         # user is using or looking at a phone (distraction)


split:
  train: 0.70
  val: 0.15
  test: 0.15

gap_ratio: 0.02

device: auto
num_workers: 0

cap_train_per_group: 200

freeze_epochs: 2
weight_decay: 0.0001
dropout_p: 0.3

